<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karlu | Stardust Labs</title>
<meta name="description" content="Karlu, o robô de olhos animados da Stardust Labs.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="pp" id="pp-root"></section>

<section class="sec sec-alt" style="margin-top:50px">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow rv">Compare</span>
      <h2 class="rv">Veja o que cada <span class="grad">versão</span> traz.</h2>
    </div>
    <div class="rv" data-compare></div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow rv">Dúvidas</span>
      <h2 class="rv">Perguntas <span class="grad">frequentes</span>.</h2>
    </div>
    <div class="faq rv" id="faq-list"></div>
  </div>
</section>

<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow rv">Outros modelos</span>
      <h2 class="rv">Conheça os <span class="grad">outros</span> Karlus.</h2>
    </div>
    <div class="other" data-cards data-skip="auto"></div>
  </div>
</section>

<script src="js/products.js"></script>
<script src="js/eyes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
